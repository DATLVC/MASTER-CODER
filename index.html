<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hệ Thống Giải & Phân Tích Ma Trận Từng Bước</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      padding: 20px;
      margin: 0;
    }
    .container {
      background-color: #1e293b;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      max-width: 850px;
      width: 100%;
    }
    h2 {
      margin: 0 0 6px 0;
      color: #38bdf8;
      text-align: center;
    }
    .subtitle {
      text-align: center;
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 20px;
    }
    .control-panel {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      justify-content: space-between;
      align-items: center;
      background: #0f172a;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .input-group label {
      font-size: 12px;
      color: #cbd5e1;
      font-weight: bold;
    }
    select {
      padding: 8px 12px;
      border-radius: 6px;
      background: #334155;
      color: #fff;
      border: 1px solid #475569;
      font-size: 14px;
    }
    .btn-group {
      display: flex;
      gap: 8px;
    }
    .matrices-wrapper {
      display: flex;
      justify-content: center;
      gap: 30px;
      margin: 20px 0;
      flex-wrap: wrap;
    }
    .matrix-card {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .matrix-title {
      font-weight: bold;
      color: #38bdf8;
      margin-bottom: 8px;
    }
    .grid-matrix {
      display: grid;
      gap: 6px;
      background: #0f172a;
      padding: 12px;
      border-radius: 8px;
      border-left: 3px solid #38bdf8;
      border-right: 3px solid #38bdf8;
    }
    .grid-matrix input {
      width: 50px;
      height: 38px;
      text-align: center;
      font-size: 15px;
      font-weight: bold;
      background: #1e293b;
      color: #fff;
      border: 1px solid #475569;
      border-radius: 4px;
    }
    .btn {
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    .btn-primary {
      background-color: #0284c7;
      color: white;
      width: 100%;
      font-size: 16px;
    }
    .btn-primary:hover {
      background-color: #0369a1;
    }
    .btn-secondary {
      background-color: #334155;
      color: #e2e8f0;
    }
    .result-box {
      margin-top: 20px;
      background: #0b1120;
      padding: 18px;
      border-radius: 8px;
      border-left: 4px solid #10b981;
      font-family: "Consolas", monospace;
      white-space: pre-wrap;
      line-height: 1.7;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>🧮 Máy Tính Ma Trận Kèm Lời Giải Sư Phạm</h2>
    <p class="subtitle">Giải thích cặn kẽ bản chất công thức toán học từng bước</p>

    <div class="control-panel">
      <div class="input-group">
        <label>Phép toán:</label>
        <select id="operation-type" onchange="doiPhepToan()">
          <option value="inv">Ma trận nghịch đảo (A⁻¹)</option>
          <option value="det">Định thức & kiểm tra ma trận vuông</option>
          <option value="rank">Hạng của ma trận (rank A)</option>
          <option value="add">Cộng hai ma trận (A + B)</option>
          <option value="mul">Nhân hai ma trận (A × B)</option>
          <option value="solve_x">Tìm ma trận X (A · X = B)</option>
        </select>
      </div>

      <div class="input-group">
        <label>Cấp ma trận (n × n):</label>
        <select id="matrix-size" onchange="taoBangNhap()">
          <option value="2">2 x 2</option>
          <option value="3" selected>3 x 3</option>
          <option value="4">4 x 4</option>
        </select>
      </div>

      <div class="btn-group">
        <button class="btn btn-secondary" onclick="nhapNgauNhien()">🎲 Ngẫu nhiên</button>
        <button class="btn btn-secondary" onclick="xoaTrang()">🗑️ Xóa trắng</button>
      </div>
    </div>

    <div class="matrices-wrapper">
      <div class="matrix-card">
        <div class="matrix-title">Ma trận A</div>
        <div id="container-A" class="grid-matrix"></div>
      </div>

      <div id="wrapper-B" class="matrix-card" style="display: none;">
        <div class="matrix-title">Ma trận B</div>
        <div id="container-B" class="grid-matrix"></div>
      </div>
    </div>

    <button class="btn btn-primary" onclick="thucThi()">🚀 TÍNH TOÁN & XUẤT LỜI GIẢI CHI TIẾT</button>

    <div id="output-box" class="result-box" style="display: none;"></div>
  </div>

  <script>
    window.onload = taoBangNhap;

    function dinhDangSo(tu, mau = 1) {
      if (mau === 0) return "Lỗi";
      if (tu === 0) return "0";
      return `${Math.round(tu / mau)}`;
    }

    function taoBangCho(idContainer, n, tienToId) {
      const container = document.getElementById(idContainer);
      container.innerHTML = "";
      container.style.gridTemplateColumns = `repeat(${n}, 50px)`;
      for (let i = 0; i < n; i++) {
        for (let j = 0; j < n; j++) {
          const input = document.createElement("input");
          input.type = "number";
          input.step = "1";
          input.id = `${tienToId}-${i}-${j}`;
          input.value = (i === j) ? 1 : 0;
          container.appendChild(input);
        }
      }
    }

    function taoBangNhap() {
      const n = parseInt(document.getElementById("matrix-size").value);
      taoBangCho("container-A", n, "A");
      taoBangCho("container-B", n, "B");
      document.getElementById("output-box").style.display = "none";
    }

    function doiPhepToan() {
      const op = document.getElementById("operation-type").value;
      const wrapB = document.getElementById("wrapper-B");
      if (op === "add" || op === "mul" || op === "solve_x") {
        wrapB.style.display = "flex";
      } else {
        wrapB.style.display = "none";
      }
    }

    function layDuLieu(tienToId, n) {
      const M = [];
      for (let i = 0; i < n; i++) {
        M[i] = [];
        for (let j = 0; j < n; j++) {
          const v = parseInt(document.getElementById(`${tienToId}-${i}-${j}`).value, 10);
          M[i][j] = isNaN(v) ? 0 : v;
        }
      }
      return M;
    }

    function inMaTran(M) {
      return M.map(r => "[ " + r.map(v => `${v}`.padEnd(6, " ")).join(", ") + " ]").join("\n");
    }

    function layMaTranCon(M, r, c) {
      return M.filter((_, i) => i !== r).map(row => row.filter((_, j) => j !== c));
    }

    function tinhDinhThuc(M) {
      const n = M.length;
      if (n === 1) return M[0][0];
      if (n === 2) return M[0][0] * M[1][1] - M[0][1] * M[1][0];
      let det = 0;
      for (let c = 0; c < n; c++) {
        const sub = layMaTranCon(M, 0, c);
        det += Math.pow(-1, c) * M[0][c] * tinhDinhThuc(sub);
      }
      return Math.round(det);
    }

    function thucThi() {
      const n = parseInt(document.getElementById("matrix-size").value);
      const op = document.getElementById("operation-type").value;
      const A = layDuLieu("A", n);
      const out = document.getElementById("output-box");
      out.style.display = "block";

      let log = "";

      // 1. TÍNH NGHỊCH ĐẢO VÀ GIẢI THÍCH CHI TIẾT
      if (op === "inv") {
        log += "========================================================\n";
        log += "  PHÂN TÍCH CHI TIẾT TÌM MA TRẬN NGHỊCH ĐẢO A⁻¹\n";
        log += "========================================================\n\n";
        log += "Ma trận ban đầu A:\n" + inMaTran(A) + "\n\n";

        // Bước 1: Tính định thức
        const det = tinhDinhThuc(A);
        log += "📍 BƯỚC 1: TÍNH ĐỊNH THỨC det(A)\n";
        log += `• det(A) = ${det}\n`;
        if (det === 0) {
          log += "❌ KẾT LUẬN: Vì det(A) = 0, ma trận suy biến nên KHÔNG TỒN TẠI ma trận nghịch đảo.\n";
          out.innerText = log;
          return;
        }
        log += `• Vì det(A) = ${det} ≠ 0 => Ma trận A khả nghịch (tồn tại A⁻¹).\n\n`;

        // Bước 2: Tính từng phần bù đại số
        log += "📍 BƯỚC 2: TÌM CÁC PHẦN BÙ ĐẠI SỐ C_ij = (-1)^(i+j) * M_ij\n";
        log += "(Trong đó M_ij là định thức ma trận con bỏ đi dòng i và cột j)\n\n";

        const C = [];
        const adj = [];
        for (let i = 0; i < n; i++) {
          C[i] = [];
          adj[i] = [];
        }

        for (let i = 0; i < n; i++) {
          for (let j = 0; j < n; j++) {
            const sub = layMaTranCon(A, i, j);
            const minor = tinhDinhThuc(sub);
            const dau = Math.pow(-1, i + j);
            const cofactor = dau * minor;
            C[i][j] = cofactor;
            adj[j][i] = cofactor; // Chuyển vị

            log += `• Vị trí C[${i+1},${j+1}]: (-1)^(${i+1}+${j+1}) * det(M_${i+1}${j+1}) = (${dau > 0 ? '+1' : '-1'}) * (${minor}) = ${cofactor}\n`;
          }
        }

        log += "\n=> Ma trận các phần bù đại số C:\n" + inMaTran(C) + "\n\n";

        // Bước 3: Tìm ma trận phụ hợp adj(A)
        log += "📍 BƯỚC 3: TÌM MA TRẬN PHỤ HỢP adj(A) = C^T\n";
        log += "• Lấy chuyển vị của ma trận C (đổi dòng thành cột):\n";
        log += inMaTran(adj) + "\n\n";

        // Bước 4: Áp dụng công thức
        log += "📍 BƯỚC 4: TÍNH A⁻¹ THEO CÔNG THỨC: A⁻¹ = (1 / det(A)) * adj(A)\n";
        log += `• Lấy từng phần tử của adj(A) chia cho det(A) = ${det}:\n`;

        const inv = [];
        for (let i = 0; i < n; i++) {
          inv[i] = [];
          for (let j = 0; j < n; j++) {
            inv[i][j] = dinhDangSo(adj[i][j], det);
          }
        }
        log += "\n🎯 ĐÁP SỐ CUỐI CÙNG (Số nguyên):\n" + inMaTran(inv);
      }

      // 2. PHÉP NHÂN HAI MA TRẬN VÀ GIẢI THÍCH
      else if (op === "mul") {
        const B = layDuLieu("B", n);
        log += "========================================================\n";
        log += "  PHÂN TÍCH CHI TIẾT PHÉP NHÂN HAI MA TRẬN (C = A × B)\n";
        log += "========================================================\n\n";
        log += "Quy tắc: Phần tử C[i, j] bằng TÍCH VÔ HƯỚNG giữa [Hàng i của A] và [Cột j của B].\n";
        log += "Công thức: C[i, j] = A[i, 1]*B[1, j] + A[i, 2]*B[2, j] + ...\n\n";

        const C = [];
        for (let i = 0; i < n; i++) {
          C[i] = [];
          for (let j = 0; j < n; j++) {
            let sum = 0;
            let stepStr = [];
            for (let k = 0; k < n; k++) {
              sum += A[i][k] * B[k][j];
              stepStr.push(`(${A[i][k]} × ${B[k][j]})`);
            }
            C[i][j] = Math.round(sum);
            log += `• C[${i+1},${j+1}] = ${stepStr.join(" + ")} = ${sum}\n`;
          }
        }
        log += "\n🎯 KẾT QUẢ TÍCH A × B:\n" + inMaTran(C);
      }

      // 3. PHÉP CỘNG MA TRẬN
      else if (op === "add") {
        const B = layDuLieu("B", n);
        log += "========================================================\n";
        log += "  PHÂN TÍCH PHÉP CỘNG HAI MA TRẬN (C = A + B)\n";
        log += "========================================================\n\n";
        log += "Quy tắc: Cộng từng phần tử ở các vị trí tương ứng C[i, j] = A[i, j] + B[i, j]:\n\n";

        const C = [];
        for (let i = 0; i < n; i++) {
          C[i] = [];
          for (let j = 0; j < n; j++) {
            const sum = A[i][j] + B[i][j];
            C[i][j] = sum;
            log += `• C[${i+1},${j+1}] = A[${i+1},${j+1}] + B[${i+1},${j+1}] = ${A[i][j]} + (${B[i][j]}) = ${sum}\n`;
          }
        }
        log += "\n🎯 KẾT QUẢ A + B:\n" + inMaTran(C);
      }

      // 4. TÌM MA TRẬN X (A · X = B)
      else if (op === "solve_x") {
        const B = layDuLieu("B", n);
        const det = tinhDinhThuc(A);
        log += "========================================================\n";
        log += "  PHÂN TÍCH GIẢI PHƯƠNG TRÌNH MA TRẬN: A · X = B\n";
        log += "========================================================\n\n";
        log += "• Ta có phương trình: A · X = B\n";
        log += "• Nhân cả hai vế bên trái với A⁻¹:\n";
        log += "    (A⁻¹ · A) · X = A⁻¹ · B\n";
        log += "    I · X = A⁻¹ · B\n";
        log += "    => X = A⁻¹ · B\n\n";

        if (det === 0) {
          log += "❌ Định thức det(A) = 0 nên A không khả nghịch, không thể tìm X bằng nghịch đảo.";
        } else {
          log += `1. Định thức det(A) = ${det} ≠ 0 => Tồn tại A⁻¹.\n`;

          // Tính adj(A)
          const adj = [];
          for (let i = 0; i < n; i++) adj[i] = [];
          for (let i = 0; i < n; i++) {
            for (let j = 0; j < n; j++) {
              const sub = layMaTranCon(A, i, j);
              adj[j][i] = Math.pow(-1, i + j) * tinhDinhThuc(sub);
            }
          }

          log += "2. Nhân [Ma trận phụ hợp adj(A)] với [Ma trận B]:\n";
          const X = [];
          for (let i = 0; i < n; i++) {
            X[i] = [];
            for (let j = 0; j < n; j++) {
              let sum = 0;
              let stepStr = [];
              for (let k = 0; k < n; k++) {
                sum += adj[i][k] * B[k][j];
                stepStr.push(`(${adj[i][k]} × ${B[k][j]})`);
              }
              const val = Math.round(sum / det);
              X[i][j] = val;
              log += `• X[${i+1},${j+1}] = [${stepStr.join(" + ")}] / ${det} = ${sum} / ${det} = ${val}\n`;
            }
          }
          log += "\n🎯 NGHIỆM MA TRẬN X (Số nguyên):\n" + inMaTran(X);
        }
      }

      // 5. ĐỊNH THỨC
      else if (op === "det") {
        const det = tinhDinhThuc(A);
        log += "========================================================\n";
        log += "  PHÂN TÍCH ĐỊNH THỨC det(A)\n";
        log += "========================================================\n\n";
        log += "Khai triển Laplace theo dòng đầu tiên:\n";
        let step = [];
        for (let c = 0; c < n; c++) {
          const sub = layMaTranCon(A, 0, c);
          const subDet = tinhDinhThuc(sub);
          const dau = Math.pow(-1, c);
          step.push(`(${dau > 0 ? '+1' : '-1'}) × ${A[0][c]} × det(M_1${c+1}: ${subDet})`);
        }
        log += `• det(A) = ${step.join(" + ")} = ${det}\n\n`;
        log += det !== 0
          ? "=> det(A) ≠ 0: Ma trận không suy biến (có nghịch đảo, các hàng độc lập tuyến tính)."
          : "=> det(A) = 0: Ma trận suy biến (không có nghịch đảo, các hàng phụ thuộc tuyến tính).";
      }

      // 6. HẠNG MA TRẬN
      else if (op === "rank") {
        log += "========================================================\n";
        log += "  TÌM HẠNG CỦA MA TRẬN (RANK)\n";
        log += "========================================================\n\n";
        log += "• Bản chất: Số lượng các hàng (hoặc cột) độc lập tuyến tính tối đa.\n";
        log += "• Phương pháp: Dùng các phép biến đổi sơ cấp đưa về dạng ma trận bậc thang.\n";

        // Khử Gauss
        let M = A.map(r => [...r]);
        let rank = n;
        for (let row = 0; row < rank; row++) {
          if (M[row][row] !== 0) {
            for (let col = 0; col < n; col++) {
              if (col !== row) {
                let factor = M[col][row] / M[row][row];
                for (let i = row; i < n; i++) M[col][i] -= factor * M[row][i];
              }
            }
          } else {
            let reduce = true;
            for (let i = row + 1; i < n; i++) {
              if (M[i][row] !== 0) {
                let temp = M[row];
                M[row] = M[i];
                M[i] = temp;
                reduce = false;
                break;
              }
            }
            if (reduce) {
              rank--;
              for (let i = 0; i < n; i++) M[i][row] = M[i][rank];
            }
            row--;
          }
        }
        log += `\n🎯 Hạng của ma trận: rank(A) = ${rank}\n`;
        log += rank === n ? "=> Ma trận có hạng đầy đủ." : `=> Ma trận suy biến (khuyết ${n - rank} chiều).`;
      }

      out.innerText = log;
    }

    function nhapNgauNhien() {
      const n = parseInt(document.getElementById("matrix-size").value);
      ["A", "B"].forEach(tienTo => {
        for (let i = 0; i < n; i++) {
          for (let j = 0; j < n; j++) {
            const el = document.getElementById(`${tienTo}-${i}-${j}`);
            if (el) el.value = Math.floor(Math.random() * 9) - 4;
          }
        }
      });
    }

    function xoaTrang() {
      const n = parseInt(document.getElementById("matrix-size").value);
      ["A", "B"].forEach(tienTo => {
        for (let i = 0; i < n; i++) {
          for (let j = 0; j < n; j++) {
            const el = document.getElementById(`${tienTo}-${i}-${j}`);
            if (el) el.value = 0;
          }
        }
      });
    }
  </script>
</body>
</html>
